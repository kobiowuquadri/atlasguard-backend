packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency lifecycle scripts by default; these are the ones we need.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - "@nestjs/core"
  - esbuild
  - prisma
  - embedded-postgres
  - "@embedded-postgres/windows-x64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
