# Render Blueprint for the AtlasGuard API (repository root = this folder).
# PostgreSQL is external (Clever Cloud): paste its URL as DATABASE_URL when Render asks.
# The dashboard deploys separately (Vercel); N-ATLaS runs on a GPU host.
# Free plan: the web service sleeps after 15 minutes without requests (≈1 min cold start).
services:
  - type: web
    name: atlasguard-api
    runtime: node
    region: frankfurt # closest Render region to Nigeria
    plan: free
    # Render's Node image ships pnpm (read-only, so `corepack enable` fails there).
    # NODE_ENV=production (below) makes pnpm skip devDependencies, but the build needs them
    # (TypeScript, Nest CLI, Prisma CLI), so the install step runs in development mode.
    buildCommand: >-
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm build:packages &&
      pnpm --filter @atlasguard/api exec prisma generate &&
      pnpm --filter @atlasguard/api build
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # postgresql://…?connection_limit=2&pool_timeout=20 (Clever Cloud DEV allows 5 connections in total)
      - key: TRUST_PROXY
        value: "true"
      - key: API_KEY_PEPPER
        generateValue: true
      - key: APP_ORIGINS
        sync: false # the dashboard origin, e.g. https://atlasguard.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: NATLAS_BASE_URL
        sync: false
      - key: NATLAS_API_KEY
        sync: false
      - key: NATLAS_MODEL_REVISION
        sync: false
      - key: NATLAS_MAX_CONCURRENCY
        value: "1" # the AtlasGuard inference service generates one response at a time
