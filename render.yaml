# Render Blueprint for the AtlasGuard API + PostgreSQL (repository root = this folder).
# The dashboard deploys separately (Vercel); N-ATLaS runs on a GPU host.
# Free plans: the web service sleeps after 15 minutes without requests (≈1 min cold start) and
# free PostgreSQL databases expire after 30 days — use paid plans for anything long-lived.
databases:
  - name: atlasguard-db
    databaseName: atlasguard
    user: atlasguard
    region: frankfurt # closest Render region to Nigeria; must match the service
    plan: free

services:
  - type: web
    name: atlasguard-api
    runtime: node
    region: frankfurt
    plan: free
    # NODE_ENV=production (below) makes pnpm skip devDependencies, but the build needs them
    # (TypeScript, Nest CLI, Prisma CLI), so the install step runs in development mode.
    buildCommand: >-
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm build:packages &&
      pnpm --filter @atlasguard/api exec prisma generate &&
      pnpm --filter @atlasguard/api build
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: atlasguard-db
          property: connectionString
      - key: TRUST_PROXY
        value: "true"
      - key: API_KEY_PEPPER
        generateValue: true
      - key: APP_ORIGINS
        sync: false # the dashboard origin, e.g. https://atlasguard.vercel.app
      - key: ADMIN_EMAILS
        sync: false
      - key: NATLAS_BASE_URL
        sync: false
      - key: NATLAS_API_KEY
        sync: false
      - key: NATLAS_MODEL_REVISION
        sync: false
      - key: NATLAS_MAX_CONCURRENCY
        value: "1" # the AtlasGuard inference service generates one response at a time
